<!-- Micro-interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const pattern = document.getElementById('dynamic-pattern');
        
        // Subtle parallax move on mouse
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 100;
            const moveY = (e.clientY - window.innerHeight / 2) / 100;
            pattern.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
        });

        // Handle mobile orientation for the same effect
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma && e.beta) {
                    const moveX = e.gamma / 10;
                    const moveY = e.beta / 10;
                    pattern.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
                }
            });
        }
    });
</script>
